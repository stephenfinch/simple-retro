<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>You're offline · Simple Retro</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f4ee; --fg: #26231e; --muted: #6b665c; --note: #fff3a3; --primary: #2d6cdf; --dot: rgb(38 35 30 / 0.08); }
  @media (prefers-color-scheme: dark) { :root { --bg: #14121a; --fg: #f3f2f6; --muted: #a9a6b2; --note: #4a4322; --primary: #6f9df0; --dot: rgb(255 255 255 / 0.05); } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; font: 500 16px/1.5 system-ui, -apple-system, sans-serif; color: var(--fg);
         background: var(--bg) radial-gradient(circle at 1px 1px, var(--dot) 1px, transparent 0) 0 0 / 20px 20px; }
  .note { position: relative; max-width: 340px; padding: 28px 24px 24px; border-radius: 3px; text-align: center;
          background: linear-gradient(225deg, transparent 14px, var(--note) 0); box-shadow: 0 1px 1px rgb(0 0 0 / 0.06), 0 10px 20px -12px rgb(0 0 0 / 0.35); }
  svg { display: block; margin: 0 auto; }
  h1 { margin: 12px 0 4px; font-size: 20px; font-weight: 800; }
  p { margin: 0 0 20px; color: var(--muted); }
  button { font: inherit; font-weight: 700; color: #fff; background: var(--primary); border: 0; border-radius: 999px; padding: 10px 22px; cursor: pointer; }
</style>
</head>
<body>
  <div class="note">
    <svg viewBox="0 0 32 32" width="56" height="56" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2D6CDF"/><stop offset="1" stop-color="#5AA0FF"/></linearGradient></defs><rect width="32" height="32" rx="9" fill="url(#g)"/><path d="M10.5 12.5a7 7 0 1 1-1.2 7.4" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><path d="M7.6 9.6l3 3.1-3.6 1.4" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="16.5" cy="16.5" r="2.2" fill="#fff"/></svg>
    <h1>You're offline</h1>
    <p>Simple Retro needs a connection to keep everyone in sync. Check your Wi-Fi or data, then try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
